<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log · Milestone</title><link rel="stylesheet" href="/admin/assets/css/tokens.css"><link rel="stylesheet" href="/admin/assets/css/base.css"><link rel="stylesheet" href="/admin/assets/css/components.css"><link rel="stylesheet" href="/admin/assets/css/admin-static.css"><link rel="stylesheet" href="/admin/assets/css/pages/admin-audit.css"></head><body><main class="page"><div class="container"><header class="page-header"><div><p class="eyebrow">Admin · Governance</p><h1>Audit log</h1><p>Role, account, course, and project administration history.</p></div><button class="btn secondary" id="exportCsv">↓ Export CSV</button></header><section class="card audit-card"><div class="audit-toolbar"><div class="select" id="auditSelect"><button class="select-trigger"><span>All actions</span>⌄</button><div class="select-menu" hidden><button data-value="all" aria-selected="true">All actions</button><button data-value="role">Role changes</button><button data-value="account">Account changes</button><button data-value="course">Course changes</button><button data-value="project">Project changes</button></div></div><p><span id="visibleCount">5</span> records · Showing the last 30 days</p></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Administrator</th><th>Action</th><th>Target</th><th>Result</th></tr></thead><tbody id="auditBody"></tbody></table><div class="audit-empty" id="auditEmpty" hidden>No audit records match this filter.</div></div></section></div><div class="toast" id="auditToast" hidden><div><strong>Export ready</strong><p id="toastCopy"></p></div><button>×</button></div></main><script src="/admin/assets/js/pages/admin-audit.js"></script></body></html>
